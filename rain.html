<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rain in Leiderdorp</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        background: transparent;
        color: #37352f;
    }

    .widget {
        width: 100%;
        max-width: 360px;
    }

    .title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 2px;
    }

    .subtitle {
        font-size: 12px;
        color: #787774;
        margin-bottom: 10px;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        margin-bottom: 8px;
        min-height: 18px;
    }

    .status-icon {
        font-size: 15px;
    }

    .status-text {
        color: #37352f;
    }

    .chart-container {
        width: 100%;
        height: 105px;
        position: relative;
    }

    canvas {
        width: 100%;
        height: 105px;
        display: block;
    }

    .times {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #9b9a97;
        margin-top: 2px;
    }

    .footer {
        margin-top: 8px;
        font-size: 9px;
        color: #9b9a97;
        text-align: right;
    }

    .loading {
        color: #9b9a97;
    }

    .error {
        color: #c45555;
    }
</style>
</head>

<body>

<div class="widget">

    <div class="title">🌧️ Rain in Leiderdorp</div>

    <div class="subtitle">Next 2 hours</div>

    <div class="status">
        <span class="status-icon" id="statusIcon">🌤️</span>
        <span class="status-text" id="statusText">
            <span class="loading">Loading…</span>
        </span>
    </div>

    <div class="chart-container">
        <canvas id="rainChart"></canvas>
    </div>

    <div class="times" id="times"></div>

    <div class="footer">
        <span>Data: Buienradar.nl</span>
        <span id="updated"></span>
    </div>

</div>

<script>

const LAT = 52.16;
const LON = 4.53;

const DATA_URL =
    `https://gadgets.buienradar.nl/data/raintext/?lat=${LAT}&lon=${LON}`;

const REFRESH_INTERVAL = 5 * 60 * 1000;
const RETRY_INTERVAL = 60 * 1000;

const canvas = document.getElementById("rainChart");
const ctx = canvas.getContext("2d");

let rainData = [];


/* ---------------------------------------------------------
   Convert Buienradar value to rainfall intensity
--------------------------------------------------------- */

function valueToMm(value) {

    if (value < 77) {
        return 0;
    }

    return Math.pow(10, (value - 109) / 32);
}


/* ---------------------------------------------------------
   Format rainfall
--------------------------------------------------------- */

function formatRain(mm) {

    if (mm < 0.05) {
        return "0";
    }

    if (mm < 10) {
        return mm.toFixed(1);
    }

    return Math.round(mm).toString();
}


/* ---------------------------------------------------------
   Convert HH:MM to minutes
--------------------------------------------------------- */

function timeToMinutes(time) {

    const parts = time.split(":");

    return parseInt(parts[0], 10) * 60 +
           parseInt(parts[1], 10);
}


/* ---------------------------------------------------------
   Find the next rain event using actual current time
--------------------------------------------------------- */

function findNextRain() {

    if (rainData.length === 0) {
        return null;
    }

    const now = new Date();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    for (let i = 0; i < rainData.length; i++) {

        const rainMinutes =
            timeToMinutes(rainData[i].time);

        /*
         * Allow for the data crossing midnight.
         */
        let difference =
            rainMinutes - currentMinutes;

        if (difference < -720) {
            difference += 1440;
        }

        /*
         * 0.1 mm/h is our threshold for
         * meaningful rain.
         */
        if (
            rainData[i].mm >= 0.1 &&
            difference >= -5
        ) {
            return {
                index: i,
                data: rainData[i],
                minutes: Math.max(0, difference)
            };
        }
    }

    return null;
}


/* ---------------------------------------------------------
   Fetch fresh Buienradar data
--------------------------------------------------------- */

async function loadRainData() {

    try {

        /*
         * Add a unique timestamp so the browser,
         * Notion and intermediate caches cannot
         * simply reuse the previous response.
         */
        const cacheBuster = Date.now();

        const url =
            DATA_URL +
            "&_=" +
            cacheBuster;

        const response = await fetch(
            url,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "Buienradar returned HTTP " +
                response.status
            );
        }

        const text = await response.text();

        const lines = text
            .trim()
            .split(/\r?\n/)
            .filter(line => line.includes("|"));

        const data = [];

        for (const line of lines) {

            const parts = line.split("|");

            if (parts.length !== 2) {
                continue;
            }

            const raw =
                parseInt(parts[0], 10);

            const time =
                parts[1].trim();

            if (Number.isNaN(raw)) {
                continue;
            }

            data.push({
                raw: raw,
                mm: valueToMm(raw),
                time: time
            });
        }

        if (data.length === 0) {
            throw new Error(
                "No rain data available."
            );
        }

        /*
         * Only replace the existing data after
         * we successfully received valid data.
         */
        rainData = data;

        updateWidget();

        updateTimestamp();

        console.log(
            "Rain data updated:",
            new Date().toLocaleTimeString()
        );

    } catch (error) {

        console.error(
            "Rain data refresh failed:",
            error
        );

        /*
         * Keep displaying the previous graph.
         * Don't replace it with an error message.
         */

        document.getElementById(
            "updated"
        ).textContent = " · update failed";

        /*
         * Try again in one minute.
         */
        setTimeout(
            loadRainData,
            RETRY_INTERVAL
        );
    }
}


/* ---------------------------------------------------------
   Show last update time
--------------------------------------------------------- */

function updateTimestamp() {

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    document.getElementById(
        "updated"
    ).textContent =
        " · Updated " + time;
}


/* ---------------------------------------------------------
   Update status text
--------------------------------------------------------- */

function updateStatus() {

    const statusIcon =
        document.getElementById("statusIcon");

    const statusText =
        document.getElementById("statusText");

    const nextRain =
        findNextRain();

    if (!nextRain) {

        statusIcon.textContent = "☀️";
        statusText.textContent =
            "No rain expected";

        return;
    }

    const minutes =
        nextRain.minutes;

    statusIcon.textContent = "🌧️";

    if (minutes <= 0) {

        statusText.textContent =
            `Rain now · ${formatRain(nextRain.data.mm)} mm/h`;

        return;
    }

    let timeText;

    if (minutes < 60) {

        timeText =
            `in ${minutes} min`;

    } else {

        const hours =
            Math.floor(minutes / 60);

        const mins =
            minutes % 60;

        if (mins === 0) {

            timeText =
                `in ${hours} hr`;

        } else {

            timeText =
                `in ${hours} hr ${mins} min`;
        }
    }

    statusText.textContent =
        `Rain ${timeText} · ${formatRain(nextRain.data.mm)} mm/h`;
}


/* ---------------------------------------------------------
   Draw chart
--------------------------------------------------------- */

function drawChart() {

    const rect = canvas.getBoundingClientRect();

    const dpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const width = rect.width;
    const height = rect.height;

    ctx.clearRect(0, 0, width, height);

    if (rainData.length < 2) {
        return;
    }

    /*
     * Space for the scale on both sides.
     */
    const scaleWidth = 30;

    const paddingLeft = scaleWidth;
    const paddingRight = scaleWidth;
    const paddingTop = 8;
    const paddingBottom = 8;

    const chartWidth =
        width - paddingLeft - paddingRight;

    const chartHeight =
        height - paddingTop - paddingBottom;


    /*
     * Logarithmic scale.
     *
     * Minimum graph range is 10 mm/h so that
     * the scale stays consistent.
     */
    const maxRain = Math.max(
        10,
        ...rainData.map(d => d.mm)
    );


    function yForRain(mm) {

        if (mm <= 0) {
            return paddingTop + chartHeight;
        }

        const maxLog = Math.log10(maxRain + 1);
        const valueLog = Math.log10(mm + 1);

        return paddingTop +
            chartHeight -
            (valueLog / maxLog) * chartHeight;
    }


    /*
     * Scale values.
     */
    const scaleValues = [
        10,
        5,
        1,
        0.5,
        0.1,
        0
    ];


    /*
     * Draw horizontal guide lines.
     */
    for (const value of scaleValues) {

        let y;

        if (value === 0) {
            y = paddingTop + chartHeight;
        } else {
            y = yForRain(value);
        }

        ctx.beginPath();

        ctx.moveTo(
            paddingLeft,
            y
        );

        ctx.lineTo(
            width - paddingRight,
            y
        );

        ctx.strokeStyle = "#eeeeec";
        ctx.lineWidth = 1;

        ctx.stroke();
    }


    /*
     * Draw scale labels.
     */
    ctx.font =
        "9px -apple-system, BlinkMacSystemFont, " +
        "\"Segoe UI\", Roboto, Helvetica, Arial, sans-serif";

    ctx.fillStyle = "#9b9a97";
    ctx.textBaseline = "middle";


    for (const value of scaleValues) {

        let y;

        if (value === 0) {
            y = paddingTop + chartHeight;
        } else {
            y = yForRain(value);
        }


        let label;

        if (value === 0) {
            label = "0";
        } else if (value < 1) {
            label = value.toString();
        } else {
            label = String(value);
        }


        /*
         * LEFT scale.
         */
        ctx.textAlign = "right";

        ctx.fillText(
            label,
            scaleWidth - 6,
            y
        );


        /*
         * RIGHT scale.
         */
        ctx.textAlign = "left";

        ctx.fillText(
            label,
            width - scaleWidth + 6,
            y
        );
    }


    /*
     * Draw graph points.
     */
    const points = rainData.map((d, i) => {

        const x =
            paddingLeft +
            (i / (rainData.length - 1)) * chartWidth;

        const y = yForRain(d.mm);

        return { x, y };
    });


    /*
     * Draw filled area.
     */
    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        paddingTop + chartHeight
    );

    for (const p of points) {
        ctx.lineTo(p.x, p.y);
    }

    ctx.lineTo(
        points[points.length - 1].x,
        paddingTop + chartHeight
    );

    ctx.closePath();

    ctx.fillStyle = "rgba(75, 140, 200, 0.15)";
    ctx.fill();


    /*
     * Draw graph line.
     */
    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        points[0].y
    );

    for (let i = 1; i < points.length; i++) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );
    }

    ctx.strokeStyle = "#4b8cc8";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.stroke();


    /*
     * Mark the first rain event.
     */
    const nextRain = findNextRain();

    if (nextRain) {

        const p = points[nextRain.index];

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#4b8cc8";
        ctx.fill();
    }
}


/* ---------------------------------------------------------
   Time labels
--------------------------------------------------------- */

function updateTimes() {

    const element =
        document.getElementById("times");

    if (rainData.length === 0) {

        element.innerHTML = "";

        return;
    }

    const count =
        rainData.length;

    const indices = [
        0,
        Math.floor(count / 2),
        count - 1
    ];

    element.innerHTML =
        indices
            .filter(
                (value, index, array) =>
                    array.indexOf(value) === index
            )
            .map(
                i =>
                    `<span>${rainData[i].time}</span>`
            )
            .join("");
}


/* ---------------------------------------------------------
   Update everything
--------------------------------------------------------- */

function updateWidget() {

    updateStatus();
    drawChart();
    updateTimes();
}


/* ---------------------------------------------------------
   Initial load
--------------------------------------------------------- */

loadRainData();


/* ---------------------------------------------------------
   Refresh every 5 minutes
--------------------------------------------------------- */

setInterval(
    loadRainData,
    REFRESH_INTERVAL
);


/* ---------------------------------------------------------
   Redraw when Notion/browser changes size
--------------------------------------------------------- */

window.addEventListener(
    "resize",
    drawChart
);


/* ---------------------------------------------------------
   Recalculate status every minute.

   This is useful because the actual clock keeps
   moving even though the Buienradar data only
   needs to be downloaded every 5 minutes.
--------------------------------------------------------- */

setInterval(
    () => {

        if (rainData.length > 0) {

            updateStatus();
            drawChart();
        }

    },
    60 * 1000
);

</script>

</body>
</html>
